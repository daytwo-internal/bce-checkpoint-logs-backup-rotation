---
- name: Backup Check Point logs to FTP and delete oldest log day
  hosts: checkpoint_log_consoles
  gather_facts: false
  become: false

  vars:
    # Día que se va a respaldar: día anterior
    backup_date: "{{ lookup('pipe', 'TZ=America/Guayaquil date -d yesterday +%F') }}"

    # Día actual, usado como referencia y control para evitar archivos de hoy
    backup_next_date: "{{ lookup('pipe', 'TZ=America/Guayaquil date -d today +%F') }}"

    # Referencias compatibles con find -newer.
    # Se selecciona todo lo modificado entre:
    # backup_date 00:00:00 y backup_date 23:59:59.
    backup_start_touch: "{{ lookup('pipe', 'TZ=America/Guayaquil date -d \"2 days ago 23:59:59\" +%Y%m%d%H%M.%S') }}"
    backup_end_touch: "{{ lookup('pipe', 'TZ=America/Guayaquil date -d \"yesterday 23:59:59\" +%Y%m%d%H%M.%S') }}"

    # Ruta de logs en las consolas Check Point
    cp_log_dir: "/opt/CPsuite-R82/fw1/log"

    # Servidor FTP central
    ftp_server: "172.23.46.29"
    ftp_remote_dir: "/"

    # Primero probar en true.
    # En true: sube al FTP, identifica qué borraría, pero NO borra.
    # En false: sube al FTP y borra la fecha más antigua.
    dry_run_delete: true

    # Controla si se ejecuta la lógica de borrado luego de FTP confirmado
    delete_oldest_after_upload: true

    # Credenciales FTP inyectadas desde AAP Credential Type
    ftp_user_effective: "{{ lookup('env', 'CHKP_FTP_USER') }}"
    ftp_password_effective: "{{ lookup('env', 'CHKP_FTP_PASSWORD') }}"

    # Retención local en consola Check Point
    retention_days: 20
    retention_cutoff_date: "{{ lookup('pipe', 'TZ=America/Guayaquil date -d \"' ~ retention_days ~ ' days ago\" +%F') }}"

  tasks:
    - name: Show execution context
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          ansible_host: "{{ ansible_host | default(inventory_hostname) }}"
          ansible_user: "{{ ansible_user | default('from AAP Machine Credential') }}"
          cp_log_dir: "{{ cp_log_dir }}"
          backup_date: "{{ backup_date }}"
          backup_next_date: "{{ backup_next_date }}"
          ftp_server: "{{ ftp_server }}"
          ftp_remote_dir: "{{ ftp_remote_dir }}"
          dry_run_delete: "{{ dry_run_delete }}"
          delete_oldest_after_upload: "{{ delete_oldest_after_upload }}"
          retention_days: "{{ retention_days }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"

    - name: Validate FTP credentials from AAP
      ansible.builtin.assert:
        that:
          - ftp_user_effective is defined
          - ftp_user_effective | length > 0
          - ftp_password_effective is defined
          - ftp_password_effective | length > 0
        fail_msg: >-
          No llegaron las credenciales FTP desde AAP para {{ inventory_hostname }}.
          Validar que el Job Template tenga asociada la credencial FTP correcta.
        success_msg: "Credenciales FTP recibidas desde AAP para {{ inventory_hostname }}"
      no_log: true

    - name: Check Check Point log directory exists
      ansible.builtin.stat:
        path: "{{ cp_log_dir }}"
      register: cp_log_dir_stat

    - name: Fail if Check Point log directory does not exist
      ansible.builtin.fail:
        msg: "La ruta {{ cp_log_dir }} no existe en {{ inventory_hostname }}"
      when: not cp_log_dir_stat.stat.exists

    ###########################################################################
    # Buscar archivos del día anterior
    # Criterios:
    # 1. Nombre inicia con backup_date.
    # 2. Archivo modificado durante backup_date, aunque no tenga fecha en nombre.
    ###########################################################################

    - name: Find previous day log files locally by name or modification date
      ansible.builtin.shell: |
        cd "{{ cp_log_dir }}"

        start_ref="/tmp/chkp_start_{{ backup_date }}_$$"
        end_ref="/tmp/chkp_end_{{ backup_date }}_$$"

        trap 'rm -f "$start_ref" "$end_ref"' EXIT

        touch -t "{{ backup_start_touch }}" "$start_ref"
        touch -t "{{ backup_end_touch }}" "$end_ref"

        (
          ls -1 {{ backup_date }}* 2>/dev/null || true

          find . -type f -newer "$start_ref" ! -newer "$end_ref" 2>/dev/null \
            | awk -F/ 'NF==2 {print $2}'
        ) | grep -v "^{{ backup_next_date }}" | sort -u
      register: previous_day_logs
      changed_when: false

    - name: Show previous day logs found locally
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          backup_date: "{{ backup_date }}"
          backup_next_date: "{{ backup_next_date }}"
          selection_criteria:
            - "Nombre inicia con {{ backup_date }}"
            - "Archivo modificado durante {{ backup_date }}"
            - "Excluye archivos cuyo nombre inicia con {{ backup_next_date }}"
          local_files_count: "{{ previous_day_logs.stdout_lines | length }}"
          local_files: "{{ previous_day_logs.stdout_lines }}"

    - name: Stop host when no previous day logs exist locally
      ansible.builtin.meta: end_host
      when: previous_day_logs.stdout_lines | length == 0

    ###########################################################################
    # Construir plan de subida FTP
    # Si el archivo ya inicia con fecha, se sube igual.
    # Si no tiene fecha, se sube con prefijo backup_date__archivo.
    ###########################################################################

    - name: Initialize FTP upload plan
      ansible.builtin.set_fact:
        ftp_upload_plan: []

    - name: Add files to FTP upload plan
      ansible.builtin.set_fact:
        ftp_upload_plan: >-
          {{
            ftp_upload_plan +
            [
              {
                'local_name': item,
                'remote_name': ((item | regex_search('^' ~ backup_date)) | ternary(item, backup_date ~ '__' ~ item))
              }
            ]
          }}
      loop: "{{ previous_day_logs.stdout_lines }}"

    - name: Show FTP upload plan
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          backup_date: "{{ backup_date }}"
          upload_plan_count: "{{ ftp_upload_plan | length }}"
          upload_plan: "{{ ftp_upload_plan }}"

    ###########################################################################
    # Consultar en FTP qué archivos ya existen
    ###########################################################################

    - name: Create FTP list command file
      ansible.builtin.tempfile:
        state: file
        suffix: "_checkpoint_ftp_list_cmd"
      register: ftp_list_command_file
      no_log: true

    - name: Write FTP list commands
      ansible.builtin.copy:
        dest: "{{ ftp_list_command_file.path }}"
        mode: "0600"
        content: |
          user {{ ftp_user_effective }} {{ ftp_password_effective }}
          binary
          cd {{ ftp_remote_dir }}
          dir
          bye
      no_log: true

    - name: Get existing previous day files from FTP server
      ansible.builtin.shell: |
        ftp -inv "{{ ftp_server }}" < "{{ ftp_list_command_file.path }}" \
        | tr -d '\r' \
        | grep -Eo '{{ backup_date }}[^[:space:]]+' \
        | sort -u || true
      register: remote_existing_logs
      changed_when: false
      failed_when: false

    - name: Remove FTP list command file
      ansible.builtin.file:
        path: "{{ ftp_list_command_file.path }}"
        state: absent
      no_log: true
      when: ftp_list_command_file.path is defined

    - name: Normalize remote FTP existing file list
      ansible.builtin.set_fact:
        remote_existing_log_files: "{{ remote_existing_logs.stdout_lines | default([]) }}"

    - name: Initialize pending FTP upload plan
      ansible.builtin.set_fact:
        ftp_upload_plan_pending: []

    - name: Add only missing files to pending upload plan
      ansible.builtin.set_fact:
        ftp_upload_plan_pending: "{{ ftp_upload_plan_pending + [item] }}"
      loop: "{{ ftp_upload_plan }}"
      when: item.remote_name not in remote_existing_log_files

    - name: Show upload comparison
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          backup_date: "{{ backup_date }}"
          local_files_count: "{{ previous_day_logs.stdout_lines | length }}"
          remote_existing_count: "{{ remote_existing_log_files | length }}"
          pending_upload_count: "{{ ftp_upload_plan_pending | length }}"
          remote_existing_files: "{{ remote_existing_log_files }}"
          files_pending_to_upload: "{{ ftp_upload_plan_pending }}"

    ###########################################################################
    # Subir solo archivos faltantes
    ###########################################################################

    - name: Skip FTP upload when all files already exist
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          status: "Todos los archivos del día {{ backup_date }} ya existen en el FTP. No se vuelve a subir nada."
      when: ftp_upload_plan_pending | length == 0

    - name: Create FTP upload command file
      ansible.builtin.tempfile:
        state: file
        suffix: "_checkpoint_ftp_upload_cmd"
      register: ftp_upload_command_file
      no_log: true
      when: ftp_upload_plan_pending | length > 0

    - name: Write FTP upload commands
      ansible.builtin.copy:
        dest: "{{ ftp_upload_command_file.path }}"
        mode: "0600"
        content: |
          user {{ ftp_user_effective }} {{ ftp_password_effective }}
          binary
          cd {{ ftp_remote_dir }}
          lcd {{ cp_log_dir }}
          {% for log_file in ftp_upload_plan_pending %}
          put {{ log_file.local_name }} {{ log_file.remote_name }}
          {% endfor %}
          bye
      no_log: true
      when: ftp_upload_plan_pending | length > 0

    - name: Upload only missing logs to FTP server
      ansible.builtin.shell: |
        ftp -inv "{{ ftp_server }}" < "{{ ftp_upload_command_file.path }}"
      register: ftp_upload_result
      changed_when: true
      no_log: true
      when: ftp_upload_plan_pending | length > 0

    - name: Remove FTP upload command file
      ansible.builtin.file:
        path: "{{ ftp_upload_command_file.path }}"
        state: absent
      no_log: true
      when:
        - ftp_upload_command_file is defined
        - ftp_upload_command_file.path is defined

    - name: Validate FTP upload command result
      ansible.builtin.fail:
        msg: "Falló la transferencia FTP en {{ inventory_hostname }} hacia {{ ftp_server }}"
      when:
        - ftp_upload_plan_pending | length > 0
        - ftp_upload_result.rc != 0

    - name: Show FTP upload confirmation
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          status: "FTP ejecutado correctamente"
          uploaded_files_count: "{{ ftp_upload_plan_pending | length }}"
          uploaded_files: "{{ ftp_upload_plan_pending }}"
      when:
        - ftp_upload_plan_pending | length > 0
        - ftp_upload_result.rc == 0

    - name: Set FTP backup status
      ansible.builtin.set_fact:
        ftp_backup_ok: "{{ (ftp_upload_plan_pending | length == 0) or (ftp_upload_result is defined and ftp_upload_result.rc == 0) }}"

    - name: Show FTP backup status
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          ftp_backup_ok: "{{ ftp_backup_ok }}"
          files_uploaded_now: "{{ ftp_upload_plan_pending | length }}"
          files_already_on_ftp: "{{ remote_existing_log_files | length }}"

    ###########################################################################
    # Borrado local de logs más antiguos solo si el respaldo FTP está confirmado
    # y solo si supera la retención definida.
    ###########################################################################

    - name: Get oldest available log date
      ansible.builtin.shell: |
        cd "{{ cp_log_dir }}"
        ls -1 \
        | awk '/^[0-9]{4}-[0-9]{2}-[0-9]{2}/ {print substr($0,1,10)}' \
        | sort -u \
        | head -1
      register: oldest_log_date
      changed_when: false
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool

    - name: Show oldest log date
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          oldest_log_date: "{{ oldest_log_date.stdout | default('NO ENCONTRADA') }}"
          retention_days: "{{ retention_days }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"
      when:
        - oldest_log_date is defined

    - name: Stop deletion block when no oldest date was found
      ansible.builtin.meta: end_host
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool
        - oldest_log_date is defined
        - oldest_log_date.stdout | length == 0

    - name: Evaluate retention policy for oldest log date
      ansible.builtin.set_fact:
        oldest_log_is_older_than_retention: "{{ oldest_log_date.stdout <= retention_cutoff_date }}"
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool
        - oldest_log_date is defined
        - oldest_log_date.stdout | length > 0

    - name: Show retention decision
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          retention_days: "{{ retention_days }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"
          oldest_log_date: "{{ oldest_log_date.stdout }}"
          can_delete_oldest_log: "{{ oldest_log_is_older_than_retention | default(false) }}"
          decision: >-
            {% if oldest_log_is_older_than_retention | default(false) %}
            El log más antiguo supera la retención de {{ retention_days }} días. Se permite borrado.
            {% else %}
            El log más antiguo está dentro de la retención de {{ retention_days }} días. No se borra.
            {% endif %}
      when:
        - oldest_log_date is defined
        - oldest_log_date.stdout | length > 0

    - name: Stop deletion because oldest log is inside retention window
      ansible.builtin.meta: end_host
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool
        - oldest_log_date is defined
        - oldest_log_date.stdout | length > 0
        - not oldest_log_is_older_than_retention | bool

    - name: Find files from oldest log date
      ansible.builtin.shell: |
        cd "{{ cp_log_dir }}"
        ls -1 {{ oldest_log_date.stdout }}* 2>/dev/null || true
      register: oldest_files_to_delete
      changed_when: false
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool
        - oldest_log_is_older_than_retention | bool

    - name: Show files selected for deletion
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          oldest_log_date: "{{ oldest_log_date.stdout }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"
          dry_run_delete: "{{ dry_run_delete }}"
          files_count: "{{ oldest_files_to_delete.stdout_lines | length }}"
          files_to_delete: "{{ oldest_files_to_delete.stdout_lines }}"
      when:
        - oldest_files_to_delete is defined

    - name: Delete files from oldest log date
      ansible.builtin.shell: |
        cd "{{ cp_log_dir }}"
        rm -f {{ oldest_log_date.stdout }}*
      register: delete_oldest_result
      changed_when: true
      when:
        - delete_oldest_after_upload | bool
        - ftp_backup_ok | bool
        - oldest_log_is_older_than_retention | bool
        - oldest_files_to_delete is defined
        - oldest_files_to_delete.stdout_lines | length > 0
        - not dry_run_delete | bool

    - name: Show deletion skipped by dry run
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          status: "DRY RUN activo, no se borró nada"
          oldest_log_date: "{{ oldest_log_date.stdout }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"
          files_that_would_be_deleted: "{{ oldest_files_to_delete.stdout_lines | default([]) }}"
      when:
        - oldest_files_to_delete is defined
        - oldest_files_to_delete.stdout_lines | length > 0
        - dry_run_delete | bool

    - name: Final summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          backup_date: "{{ backup_date }}"
          local_files_found: "{{ previous_day_logs.stdout_lines | length }}"
          files_already_on_ftp: "{{ remote_existing_log_files | length }}"
          files_uploaded_now: "{{ ftp_upload_plan_pending | length }}"
          ftp_backup_ok: "{{ ftp_backup_ok }}"
          retention_days: "{{ retention_days }}"
          retention_cutoff_date: "{{ retention_cutoff_date }}"
          oldest_date_found: "{{ oldest_log_date.stdout | default('N/A') }}"
          oldest_log_is_older_than_retention: "{{ oldest_log_is_older_than_retention | default(false) }}"
          dry_run_delete: "{{ dry_run_delete }}"
          delete_executed: "{{ (not dry_run_delete | bool) and (oldest_log_is_older_than_retention | default(false) | bool) and (oldest_files_to_delete is defined) and (oldest_files_to_delete.stdout_lines | length > 0) }}"